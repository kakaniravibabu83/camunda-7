spring:
  datasource:
    url: jdbc:h2:mem:camunda-test;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  devtools:
    restart:
      enabled: false

camunda:
  bpm:
    admin-user:
      id: admin
      password: admin
    history-level: full
    database:
      schema-update: true
    generic-properties:
      properties:
        history-time-to-live: 180
    # Fully disabled for tests. This removes the JobExecutor/camundaTaskExecutor beans,
    # which is safe here because nothing else in this app's synchronous BPMN flows
    # (Call Activities, boundary events) depends on them - that was verified after an
    # earlier, unrelated bug was mistakenly attributed to this setting and reverted.
    # A plain longer wait-time-in-millis is NOT sufficient on its own: it only throttles
    # idle polling, not hint-triggered wake-ups the executor gets from operations like
    # ManagementService.setJobRetries(), which can still race with a test's own manual
    # ManagementService.executeJob() call. Fully disabling removes the executor thread
    # entirely, so only manual calls ever touch jobs - see:
    # https://docs.camunda.org/manual/latest/user-guide/testing/
    job-execution:
      enabled: false

logging:
  level:
    org.camunda.bpm.engine: WARN
